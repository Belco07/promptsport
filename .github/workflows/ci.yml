# Vérification automatique à chaque push et pull request.
#
# 1. Les migrations Prisma s'appliquent sur une base PostgreSQL vierge
#    (détecte une migration cassée avant qu'elle n'atteigne Neon).
# 2. Lint ESLint.
# 3. Build de production Next.js.
#
# Les suites scripts/check-*.cjs ne tournent pas encore ici : la plupart
# attendent un serveur lancé, une base peuplée et parfois Stripe.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: promptsport
          POSTGRES_PASSWORD: promptsport
          POSTGRES_DB: promptsport
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U promptsport"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Valeurs factices propres à la CI : aucune clé réelle n'est nécessaire
    # pour migrer, linter et compiler.
    env:
      DATABASE_URL: postgresql://promptsport:promptsport@localhost:5432/promptsport?schema=public
      AUTH_SECRET: ci-secret-non-utilise-en-production-0123456789
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Appliquer les migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
