name: Synchronisation des scores

on:
  schedule:
    - cron: '3-59/10 * * * *'
    - cron: '7 * * * *'
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      priority:
        description: Type de synchronisation
        type: choice
        options: [check, live, upcoming, finished]
        default: live

permissions:
  contents: read

concurrency:
  group: sync-sports
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Appeler le site de production
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_PRIORITY: ${{ inputs.priority }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CRON_SECRET" || -z "$SITE_URL" ]]; then
            echo "Configurer le secret CRON_SECRET et la variable SITE_URL du dépôt."
            exit 1
          fi
          if [[ "$SITE_URL" != https://* || "$SITE_URL" == *'?'* || "$SITE_URL" == *'#'* ]]; then
            echo "SITE_URL doit être l'adresse HTTPS du site de production."
            exit 1
          fi
          priority="${MANUAL_PRIORITY:-live}"
          if [[ "$SCHEDULE" == '7 * * * *' ]]; then priority=upcoming; fi
          if [[ "$SCHEDULE" == '17 2 * * *' ]]; then priority=finished; fi
          query="priority=$priority"
          if [[ "$priority" == 'check' ]]; then query='check=1'; fi
          # Print the response and HTTP status separately: curl exit 22 alone
          # cannot distinguish missing configuration, database errors or quota.
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          http_status=$(curl --silent --show-error \
            --connect-timeout 10 --max-time 65 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            --output "$response_file" --write-out '%{http_code}' \
            "${SITE_URL%/}/api/cron/sync-sports?$query")
          cat "$response_file"
          echo
          echo "HTTP $http_status — priorité $priority — déclencheur ${GITHUB_EVENT_NAME}"
          if [[ "$http_status" != 2* ]]; then
            echo "::error::Synchronisation refusée (HTTP $http_status). Voir la réponse ci-dessus."
            exit 1
          fi
          python3 - "$response_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as response:
              result = json.load(response)
          if result.get("ok") is not True:
              sys.exit("La réponse signale une synchronisation incomplète ou en erreur.")
          print("Résultat :", result.get("skipped") or f"{result.get('synced', 0)} match(s) synchronisé(s)")
          PY
