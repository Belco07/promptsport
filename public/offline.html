<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#111410"><title>Hors connexion — PromptSport</title><style>body{margin:0;padding:32px 20px;background:#111410;color:#f4f5ef;font:18px/1.6 system-ui}main{max-width:600px;margin:10vh auto}a,button{color:#d6f500}button{font:inherit;background:none;border:1px solid #6b7267;padding:12px;cursor:pointer}li{margin:12px 0}</style></head><body><main><p>PromptSport · Mode lecture</p><h1>Vous êtes hors connexion</h1><p>Cette page n’a pas encore été sauvegardée. Retrouvez ci-dessous les pages publiques déjà consultées. Les scores et les informations sauvegardées ne sont pas actualisés.</p><ul id="saved"></ul><button onclick="location.reload()">Réessayer la connexion</button></main><script>caches.open('promptsport-pages-v1').then(c=>c.keys()).then(keys=>{for(const key of keys){const url=new URL(key.url);const li=document.createElement('li'),a=document.createElement('a');a.href=url.pathname;a.textContent=url.pathname==='/'?'Accueil':decodeURIComponent(url.pathname).replaceAll('/',' › ');li.append(a);document.querySelector('#saved').append(li)}}).catch(()=>{});</script></body></html>
